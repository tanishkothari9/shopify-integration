# Move a product between collections, from the product's side.
#
# collectionAddProductsV2 and collectionRemoveProducts, which this was first written against,
# do not exist in 2026-01. collectionUpdate does take a product list, but it *replaces* the
# collection's membership, so using it would throw every other product out of a collection
# to move one in.
#
# collectionsToJoin / collectionsToLeave are incremental and cover both directions in one
# call, and touch nothing but this product.
#
# ProductUpdateInput, not ProductInput: 2026-01 split the old input type, and productUpdate
# takes the update half. Declaring the wrong one is rejected before the mutation runs --
# "Type mismatch on variable $product and argument product" -- so every collection sync
# failed, and the fake client in the tests could not have noticed.
mutation productCollections($product: ProductUpdateInput!) {
  productUpdate(product: $product) {
    product {
      id
      collections(first: 50) {
        nodes { id title }
      }
    }
    userErrors { field message }
  }
}
