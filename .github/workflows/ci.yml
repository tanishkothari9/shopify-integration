name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - run: ruff check .
      - run: ruff format --check .

      # Tests are not run here. They need no *site*, but they do import modules that import
      # frappe, which is not pip-installable in a bare runner. Installing it would make this
      # job as slow as the integration one below, which already runs the whole suite against a
      # real site -- twice. This job stays fast on purpose.

  integration:
    name: Integration tests (Frappe ${{ matrix.frappe-branch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `develop` is the next Frappe major before it is released. It is allowed to fail:
        # its job is to tell us a coming release has broken us while there is still time to
        # do something about it, not to block a pull request on someone else's work in
        # progress. `frappe.db.savepoint` is the cautionary tale -- an API used wrongly, its
        # exception swallowed, and every Item Tax Template silently not created.
        frappe-branch: [version-15, develop]

    continue-on-error: ${{ matrix.frappe-branch == 'develop' }}

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
        with:
          path: shopify_integration

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure MariaDB for Frappe
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Install bench and build a site
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch ${{ matrix.frappe-branch }} --python "$(which python)" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
          bench get-app --branch ${{ matrix.frappe-branch }} --skip-assets erpnext
          bench get-app --skip-assets "$GITHUB_WORKSPACE/shopify_integration"
          bench new-site test.localhost \
            --mariadb-root-password root --admin-password admin \
            --no-mariadb-socket --install-app erpnext --install-app shopify_integration
          # `bench run-tests` imports pytest, and `bench init` does not bring it into the venv
          ./env/bin/pip install pytest

      - name: Run tests
        run: |
          cd ~/frappe-bench
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost run-tests --app shopify_integration

      # Run them a second time on the same site. Handlers commit deliberately, so a test that
      # does not clean up after itself passes once and fails on every run after — which is
      # exactly the kind of rot that makes a suite untrustworthy.
      - name: Run tests again (repeatability)
        run: |
          cd ~/frappe-bench
          bench --site test.localhost run-tests --app shopify_integration
